<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN — SHOP SAMM X MOD</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
  body{background:#05050f;color:#fff;min-height:100vh}
  body::before{content:'';position:fixed;inset:0;
    background:radial-gradient(circle at 15% 15%,rgba(255,51,102,.12),transparent 40%),
    radial-gradient(circle at 85% 85%,rgba(120,80,255,.12),transparent 40%);
    z-index:-1}
  header{background:rgba(10,10,25,.75);backdrop-filter:blur(20px);
    padding:1.2rem 2rem;display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid rgba(255,51,102,.3);position:sticky;top:0;z-index:100;
    box-shadow:0 8px 32px rgba(0,0,0,.5)}
  header::after{content:'';position:absolute;bottom:-1px;left:0;width:100%;height:2px;
    background:linear-gradient(90deg,transparent,#ff3366,#ffd700,#00d4ff,#ff3366,transparent);
    background-size:200% 100%;animation:shine 4s linear infinite}
  @keyframes shine{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .logo{display:flex;align-items:center;gap:12px}
  .logo i{font-size:1.8rem;color:#ffd700;filter:drop-shadow(0 0 12px #ffd700)}
  .logo h1{font-family:'Orbitron',sans-serif;font-size:1.3rem;letter-spacing:2px;
    background:linear-gradient(135deg,#fff,#ff99aa,#ff3366);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .logo h1 span{color:#ff3366;-webkit-text-fill-color:#ff3366}
  .admin-badge{background:linear-gradient(135deg,#ff3366,#a855f7);
    padding:5px 12px;border-radius:20px;font-size:.7rem;font-weight:800;
    letter-spacing:1px;margin-left:8px;box-shadow:0 0 20px rgba(255,51,102,.6)}
  .header-actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn-export{background:linear-gradient(135deg,#00d4ff,#3ddc84);color:#05050f;border:none;
    padding:10px 20px;border-radius:30px;font-weight:800;cursor:pointer;font-size:.85rem;
    display:flex;align-items:center;gap:8px;transition:.3s;
    box-shadow:0 8px 20px rgba(0,212,255,.4);text-decoration:none}
  .btn-export:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,212,255,.6)}
  .btn-reset{background:rgba(255,255,255,.06);color:#ff99aa;border:1px solid rgba(255,51,102,.3);
    padding:10px 18px;border-radius:30px;font-weight:700;cursor:pointer;font-size:.85rem;
    transition:.3s;display:flex;align-items:center;gap:6px}
  .btn-reset:hover{background:rgba(255,51,102,.2);color:#fff}
  main{max-width:1200px;margin:auto;padding:2.5rem 1.5rem}
  .title-bar{text-align:center;margin-bottom:2rem}
  .title-bar h2{font-family:'Orbitron',sans-serif;font-size:1.8rem;letter-spacing:2px;
    background:linear-gradient(135deg,#fff,#ffd700,#ff3366);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    margin-bottom:.5rem}
  .title-bar p{color:#8a8ab0;font-size:.9rem}
  .sync-info{text-align:center;color:#3ddc84;font-size:.8rem;margin-bottom:1.5rem;
    display:flex;align-items:center;justify-content:center;gap:8px}
  .sync-dot{width:8px;height:8px;background:#3ddc84;border-radius:50%;
    box-shadow:0 0 10px #3ddc84;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .tabs{display:flex;justify-content:center;gap:1rem;margin-bottom:2rem;flex-wrap:wrap}
  .tab{background:rgba(20,20,40,.6);backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.08);padding:12px 30px;border-radius:30px;
    cursor:pointer;font-weight:700;font-size:.9rem;transition:.3s;
    color:#8a8ab0;display:flex;align-items:center;gap:8px}
  .tab.active{background:linear-gradient(135deg,#ff3366,#ff6b9d);color:#fff;
    border-color:transparent;box-shadow:0 10px 30px rgba(255,51,102,.5);transform:translateY(-2px)}
  .tab:hover:not(.active){border-color:rgba(255,51,102,.5);color:#fff}
  .count-badge{background:rgba(255,255,255,.15);padding:2px 10px;border-radius:20px;
    font-size:.72rem;font-weight:800}
  .form-card{background:rgba(20,20,40,.6);backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:2rem;
    margin-bottom:2.5rem;box-shadow:0 20px 50px rgba(0,0,0,.4)}
  .form-card h3{font-size:1.1rem;margin-bottom:1.5rem;color:#fff;
    display:flex;align-items:center;gap:10px}
  .form-card h3 i{color:#ffd700}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:1rem;margin-bottom:1.5rem}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:.75rem;font-weight:700;color:#a0a0c0;
    text-transform:uppercase;letter-spacing:1px}
  .field input{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
    border-radius:12px;padding:11px 14px;color:#fff;font-size:.9rem;
    font-family:'Poppins',sans-serif;transition:.3s;outline:none}
  .field input:focus{border-color:#ff3366;background:rgba(255,51,102,.08);
    box-shadow:0 0 20px rgba(255,51,102,.3)}
  .field input::placeholder{color:#555}
  .field.full{grid-column:1/-1}
  /* UPLOAD ẢNH */
  .upload-zone{background:rgba(255,255,255,.03);border:2px dashed rgba(255,51,102,.4);
    border-radius:16px;padding:1.5rem;text-align:center;cursor:pointer;transition:.3s;
    display:flex;flex-direction:column;align-items:center;gap:10px}
  .upload-zone:hover{background:rgba(255,51,102,.08);border-color:#ff3366}
  .upload-zone.has-image{padding:1rem;border-style:solid;border-color:#3ddc84}
  .upload-icon{font-size:2rem;color:#ff3366}
  .upload-text{font-size:.85rem;color:#a0a0c0;font-weight:600}
  .upload-text small{display:block;color:#666;font-size:.75rem;margin-top:3px;font-weight:400}
  .preview-img{width:80px;height:80px;border-radius:16px;object-fit:cover;
    box-shadow:0 8px 25px rgba(0,0,0,.5)}
  .btn-remove-img{background:rgba(255,51,102,.2);color:#ff99aa;border:1px solid rgba(255,51,102,.4);
    padding:5px 12px;border-radius:20px;font-size:.72rem;font-weight:700;cursor:pointer;
    transition:.3s;margin-top:6px}
  .btn-remove-img:hover{background:#ff3366;color:#fff}
  .form-actions{display:flex;gap:12px;flex-wrap:wrap}
  .btn-primary{background:linear-gradient(135deg,#ff3366,#ff6b9d);color:#fff;border:none;
    padding:13px 28px;border-radius:30px;font-weight:700;cursor:pointer;
    font-size:.9rem;transition:.3s;display:flex;align-items:center;gap:8px;
    box-shadow:0 8px 20px rgba(255,51,102,.4)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(255,51,102,.6)}
  .btn-secondary{background:rgba(255,255,255,.05);color:#a0a0c0;
    border:1px solid rgba(255,255,255,.1);padding:13px 24px;border-radius:30px;
    font-weight:700;cursor:pointer;font-size:.9rem;transition:.3s;
    display:flex;align-items:center;gap:8px}
  .btn-secondary:hover{background:rgba(255,255,255,.1);color:#fff}
  .list-header{display:flex;justify-content:space-between;align-items:center;
    margin-bottom:1.2rem;flex-wrap:wrap;gap:1rem}
  .list-header h3{font-size:1.1rem;color:#fff;display:flex;align-items:center;gap:10px}
  .list-header h3 i{color:#ffd700}
  .items{display:flex;flex-direction:column;gap:.8rem}
  .item-row{background:rgba(20,20,40,.6);backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:1rem 1.2rem;
    display:flex;align-items:center;gap:1rem;transition:.3s;position:relative;overflow:hidden}
  .item-row::before{content:'';position:absolute;left:0;top:0;width:3px;height:100%;
    background:linear-gradient(180deg,#ff3366,#ffd700,#ff3366);opacity:0;transition:.3s}
  .item-row:hover::before{opacity:1}
  .item-row:hover{border-color:rgba(255,51,102,.4);transform:translateX(4px);
    box-shadow:0 10px 30px rgba(255,51,102,.15)}
  .item-thumb{width:60px;height:60px;border-radius:14px;flex-shrink:0;
    overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.4);position:relative;
    display:flex;align-items:center;justify-content:center}
  .item-thumb.ios-bg{background:linear-gradient(135deg,#1a1a2e,#2a2a4a);border:1px solid rgba(160,160,255,.3);color:#a0a0ff}
  .item-thumb.adr-bg{background:linear-gradient(135deg,#1a8a52,#3ddc84);border:1px solid rgba(61,220,132,.3);color:#fff}
  .item-thumb img{width:100%;height:100%;object-fit:cover}
  .item-thumb i{font-size:1.6rem}
  .item-info{flex:1;min-width:0}
  .item-info b{display:block;font-size:.98rem;margin-bottom:3px;color:#fff}
  .ver-tag{display:inline-block;background:rgba(255,51,102,.2);color:#ff99aa;
    padding:1px 7px;border-radius:6px;font-size:.68rem;font-weight:700;
    margin-left:6px;vertical-align:middle;border:1px solid rgba(255,51,102,.3)}
  .item-info small{color:#8a8ab0;font-size:.78rem;display:block;margin-top:2px}
  .item-info a{color:#00d4ff;font-size:.72rem;text-decoration:none;
    display:inline-flex;align-items:center;gap:4px;margin-top:3px;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item-info a:hover{text-decoration:underline}
  .item-actions{display:flex;gap:8px;flex-shrink:0}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.05);color:#a0a0c0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:.3s;font-size:.9rem}
  .icon-btn:hover:not(:disabled){transform:scale(1.1)}
  .icon-btn:disabled{opacity:.3;cursor:not-allowed}
  .icon-btn.edit:hover:not(:disabled){background:#00d4ff;color:#05050f;border-color:#00d4ff}
  .icon-btn.delete:hover:not(:disabled){background:#ff3366;color:#fff;border-color:#ff3366}
  .icon-btn.up:hover:not(:disabled),.icon-btn.down:hover:not(:disabled){background:#ffd700;color:#05050f;border-color:#ffd700}
  .empty{text-align:center;padding:3rem 1rem;color:#555;
    background:rgba(20,20,40,.4);border-radius:16px;
    border:1px dashed rgba(255,255,255,.1)}
  .empty i{font-size:3rem;display:block;margin-bottom:1rem;color:#333}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);
    background:linear-gradient(135deg,#ff3366,#ff6b9d);color:#fff;
    padding:14px 28px;border-radius:30px;font-weight:700;font-size:.9rem;
    box-shadow:0 15px 40px rgba(255,51,102,.6);z-index:2000;transition:.4s;
    display:flex;align-items:center;gap:10px;max-width:90vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.success{background:linear-gradient(135deg,#3ddc84,#00d4ff);color:#05050f}
  @media(max-width:600px){
    .logo h1{font-size:1rem}.admin-badge{font-size:.6rem;padding:3px 8px}
    header{padding:1rem}.btn-export,.btn-reset{padding:8px 14px;font-size:.75rem}
    main{padding:1.5rem 1rem}.item-row{flex-wrap:wrap}.item-info{width:100%}
    .form-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <i class="fas fa-crown"></i>
    <h1>SAMM <span>X</span> MOD <span class="admin-badge">⚙️ ADMIN</span></h1>
  </div>
  <div class="header-actions">
    <a class="btn-export" href="shop.html" target="_blank"><i class="fas fa-store"></i> Mở Shop</a>
    <button class="btn-reset" id="btnReset"><i class="fas fa-undo"></i> Reset</button>
  </div>
</header>

<main>
  <div class="title-bar">
    <h2>BẢNG ĐIỀU KHIỂN ADMIN</h2>
    <p>Quản lý file — Có thể đổi ảnh đại diện cho từng file</p>
  </div>
  <div class="sync-info">
    <span class="sync-dot"></span>
    Đang đồng bộ trực tiếp với Shop qua localStorage
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-ios" data-os="ios">
      <i class="fab fa-apple"></i> iOS <span class="count-badge" id="count-ios">0</span>
    </div>
    <div class="tab" id="tab-adr" data-os="adr">
      <i class="fab fa-android"></i> Android <span class="count-badge" id="count-adr">0</span>
    </div>
  </div>

  <div class="form-card">
    <h3><i class="fas fa-plus-circle"></i> <span id="formTitle">Thêm file mới</span></h3>
    <div class="form-grid">
      <div class="field"><label>Tên file</label>
        <input type="text" id="fName" placeholder="VD: FF TH MOD MENU"></div>
      <div class="field"><label>Phiên bản</label>
        <input type="text" id="fVer" placeholder="VD: v1.0"></div>
      <div class="field"><label>Dung lượng</label>
        <input type="text" id="fSize" placeholder="VD: 25 MB"></div>
      <div class="field"><label>Icon dự phòng (FontAwesome)</label>
        <input type="text" id="fIcon" placeholder="VD: fa-file"></div>
      <div class="field full"><label>Mô tả</label>
        <input type="text" id="fDesc" placeholder="VD: MOD Free Fire TH an toàn"></div>
      <div class="field full"><label>Link tải file</label>
        <input type="text" id="fLink" placeholder="https://drive.google.com/..."></div>
      <div class="field full">
        <label>Ảnh đại diện (chọn từ thư viện)</label>
        <div class="upload-zone" id="uploadZone">
          <input type="file" id="fImage" accept="image/*" style="display:none">
          <div id="uploadContent">
            <i class="fas fa-cloud-upload-alt upload-icon"></i>
            <div class="upload-text">Chọn ảnh từ thư viện
              <small>Hỗ trợ JPG, PNG, GIF — Ảnh sẽ được lưu tự động</small>
            </div>
          </div>
        </div>
        <button class="btn-remove-img" id="btnRemoveImg" style="display:none">
          <i class="fas fa-trash"></i> Xóa ảnh
        </button>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-primary" id="btnSave">
        <i class="fas fa-save"></i> <span id="saveBtnText">Lưu file</span>
      </button>
      <button class="btn-secondary" id="btnCancel" style="display:none">
        <i class="fas fa-times"></i> Hủy sửa
      </button>
    </div>
  </div>

  <div class="list-header">
    <h3><i class="fas fa-list"></i> Danh sách file <span id="listLabel">iOS</span></h3>
  </div>
  <div class="items" id="itemsList"></div>
</main>

<div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastText">Thành công</span></div>

<script>
const STORAGE_KEY = 'sammxmod_shared_data';

const DEFAULT_DATA = {
  ios: [],
  adr: []
};

let data = loadData();
let currentOS = 'ios';
let editingId = null;
let currentImageData = null; // Lưu ảnh base64 khi chọn

function loadData(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved) return JSON.parse(saved);
  }catch(e){}
  const def = JSON.parse(JSON.stringify(DEFAULT_DATA));
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(def)); }catch(e){}
  return def;
}

function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    localStorage.setItem(STORAGE_KEY + '_ping', Date.now());
  }catch(e){
    toast('Lỗi: Ảnh quá lớn hoặc bộ nhớ đầy!', false);
  }
}

function switchTab(os){
  currentOS = os;
  document.getElementById('tab-ios').classList.toggle('active', os==='ios');
  document.getElementById('tab-adr').classList.toggle('active', os==='adr');
  document.getElementById('listLabel').textContent = os==='ios' ? 'iOS' : 'Android';
  document.getElementById('formTitle').textContent = `Thêm file mới — ${os==='ios'?'iOS':'Android'}`;
  cancelEdit();
  render();
}

function render(){
  const list = data[currentOS];
  document.getElementById('count-ios').textContent = data.ios.length;
  document.getElementById('count-adr').textContent = data.adr.length;

  const box = document.getElementById('itemsList');
  box.innerHTML = '';

  if(list.length === 0){
    box.innerHTML = `<div class="empty"><i class="fas fa-folder-open"></i>Chưa có file nào. Thêm file mới ở trên!</div>`;
    return;
  }

  list.forEach((f, i) => {
    const row = document.createElement('div');
    row.className = 'item-row';
    
    // Hiển thị ảnh nếu có, không thì hiện icon
    const thumbContent = f.image 
      ? `<img src="${f.image}" alt="">`
      : `<i class="fas ${f.icon||'fa-file'}"></i>`;
    
    row.innerHTML = `
      <div class="item-thumb ${currentOS==='ios'?'ios-bg':'adr-bg'}">
        ${thumbContent}
      </div>
      <div class="item-info">
        <b>${f.name||'(chưa có tên)'}<span class="ver-tag">${f.ver||'v1.0'}</span></b>
        <small>${f.desc||'Không có mô tả'} • ${f.size||'0 MB'}</small>
        <a href="${f.link||'#'}" target="_blank" rel="noopener">
          <i class="fas fa-link"></i> ${f.link||'(chưa có link)'}
        </a>
      </div>
      <div class="item-actions">
        <button class="icon-btn up" data-act="up" data-idx="${i}" ${i===0?'disabled':''} title="Lên">
          <i class="fas fa-arrow-up"></i>
        </button>
        <button class="icon-btn down" data-act="down" data-idx="${i}" ${i===list.length-1?'disabled':''} title="Xuống">
          <i class="fas fa-arrow-down"></i>
        </button>
        <button class="icon-btn edit" data-act="edit" data-id="${f.id}" title="Sửa">
          <i class="fas fa-pen"></i>
        </button>
        <button class="icon-btn delete" data-act="delete" data-id="${f.id}" title="Xóa">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    `;
    box.appendChild(row);
  });
}

document.getElementById('itemsList').addEventListener('click', function(e){
  const btn = e.target.closest('button[data-act]');
  if(!btn) return;
  const act = btn.dataset.act;
  if(act === 'edit')   editFile(btn.dataset.id);
  if(act === 'delete') deleteFile(btn.dataset.id);
  if(act === 'up')     moveItem(parseInt(btn.dataset.idx), -1);
  if(act === 'down')   moveItem(parseInt(btn.dataset.idx), 1);
});

/* ============================================================
   XỬ LÝ ẢNH
============================================================ */
const uploadZone = document.getElementById('uploadZone');
const fImage = document.getElementById('fImage');
const uploadContent = document.getElementById('uploadContent');
const btnRemoveImg = document.getElementById('btnRemoveImg');

uploadZone.addEventListener('click', () => fImage.click());

fImage.addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;

  // Kiểm tra kích thước (giới hạn 2MB)
  if(file.size > 2 * 1024 * 1024){
    toast('Ảnh quá lớn! Vui lòng chọn ảnh dưới 2MB', false);
    fImage.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = function(ev){
    // Nén ảnh xuống trước khi lưu để tránh tràn localStorage
    compressImage(ev.target.result, 400, 400, 0.8, function(compressed){
      currentImageData = compressed;
      showPreview(compressed);
      toast('Đã chọn ảnh!', true);
    });
  };
  reader.readAsDataURL(file);
});

// Nén ảnh để tiết kiệm dung lượng
function compressImage(dataUrl, maxW, maxH, quality, callback){
  const img = new Image();
  img.onload = function(){
    let w = img.width, h = img.height;
    if(w > maxW || h > maxH){
      const ratio = Math.min(maxW/w, maxH/h);
      w = Math.round(w * ratio);
      h = Math.round(h * ratio);
    }
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    callback(canvas.toDataURL('image/jpeg', quality));
  };
  img.src = dataUrl;
}

function showPreview(dataUrl){
  uploadZone.classList.add('has-image');
  uploadContent.innerHTML = `<img src="${dataUrl}" class="preview-img" alt="preview">`;
  btnRemoveImg.style.display = 'inline-flex';
}

function clearImage(){
  currentImageData = null;
  uploadZone.classList.remove('has-image');
  uploadContent.innerHTML = `
    <i class="fas fa-cloud-upload-alt upload-icon"></i>
    <div class="upload-text">Chọn ảnh từ thư viện
      <small>Hỗ trợ JPG, PNG, GIF — Ảnh sẽ được lưu tự động</small>
    </div>
  `;
  btnRemoveImg.style.display = 'none';
  fImage.value = '';
}

btnRemoveImg.addEventListener('click', function(e){
  e.stopPropagation();
  clearImage();
  toast('Đã xóa ảnh', false);
});

/* ============================================================
   THÊM / SỬA FILE
============================================================ */
function saveFile(){
  const name = document.getElementById('fName').value.trim();
  const ver  = document.getElementById('fVer').value.trim() || 'v1.0';
  const size = document.getElementById('fSize').value.trim() || '0 MB';
  const icon = document.getElementById('fIcon').value.trim() || 'fa-file';
  const desc = document.getElementById('fDesc').value.trim();
  const link = document.getElementById('fLink').value.trim();

  if(!name){ toast('Vui lòng nhập tên file!', false); return; }

  if(editingId){
    const item = data[currentOS].find(x => x.id === editingId);
    if(item){
      Object.assign(item, {name, ver, size, icon, desc, link});
      // Cập nhật ảnh nếu có thay đổi
      if(currentImageData) item.image = currentImageData;
      else if(!currentImageData && item.image === undefined) item.image = null;
      toast('Đã cập nhật — Shop đã đồng bộ!', true);
    }
    cancelEdit();
  } else {
    const id = currentOS + '_' + Date.now();
    data[currentOS].push({ 
      id, name, ver, size, icon, desc, link, 
      image: currentImageData || null 
    });
    toast('Đã thêm file — Shop đã đồng bộ!', true);
  }

  saveData();
  clearForm();
  render();
}

function editFile(id){
  const item = data[currentOS].find(x => x.id === id);
  if(!item) return;
  editingId = id;
  document.getElementById('fName').value = item.name||'';
  document.getElementById('fVer').value = item.ver||'';
  document.getElementById('fSize').value = item.size||'';
  document.getElementById('fIcon').value = item.icon||'';
  document.getElementById('fDesc').value = item.desc||'';
  document.getElementById('fLink').value = item.link||'';
  
  // Hiển thị ảnh hiện tại
  if(item.image){
    currentImageData = item.image;
    showPreview(item.image);
  } else {
    clearImage();
  }
  
  document.getElementById('saveBtnText').textContent = 'Cập nhật';
  document.getElementById('btnCancel').style.display = 'flex';
  document.getElementById('formTitle').textContent = 'Đang sửa file';
  window.scrollTo({top:0,behavior:'smooth'});
}

function cancelEdit(){
  editingId = null;
  clearForm();
  document.getElementById('saveBtnText').textContent = 'Lưu file';
  document.getElementById('btnCancel').style.display = 'none';
  document.getElementById('formTitle').textContent = `Thêm file mới — ${currentOS==='ios'?'iOS':'Android'}`;
}

function clearForm(){
  ['fName','fVer','fSize','fIcon','fDesc','fLink'].forEach(id => {
    document.getElementById(id).value = '';
  });
  clearImage();
}

function deleteFile(id){
  const item = data[currentOS].find(x => x.id === id);
  if(!item) return;
  if(!confirm(`Bạn chắc chắn muốn xóa "${item.name}"?`)) return;
  data[currentOS] = data[currentOS].filter(x => x.id !== id);
  saveData();
  if(editingId === id) cancelEdit();
  render();
  toast('Đã xóa — Shop đã đồng bộ!', true);
}

function moveItem(index, dir){
  const list = data[currentOS];
  const newIndex = index + dir;
  if(newIndex < 0 || newIndex >= list.length) return;
  [list[index], list[newIndex]] = [list[newIndex], list[index]];
  saveData();
  render();
}

function resetAll(){
  if(!confirm('Xóa toàn bộ file hiện có?')) return;
  data = { ios: [], adr: [] };
  saveData();
  cancelEdit();
  render();
  toast('Đã xóa hết — Shop đã đồng bộ!', true);
}

let toastTimer;
function toast(msg, success){
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.toggle('success', !!success);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

document.getElementById('tab-ios').addEventListener('click', () => switchTab('ios'));
document.getElementById('tab-adr').addEventListener('click', () => switchTab('adr'));
document.getElementById('btnSave').addEventListener('click', saveFile);
document.getElementById('btnCancel').addEventListener('click', cancelEdit);
document.getElementById('btnReset').addEventListener('click', resetAll);

render();
</script>
</body>
</html>
